name: GitHub-Profile-3D-Contrib

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/3d-contrib.yml
      - scripts/round_contrib_svg.py
      - scripts/profile_slices.py
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Extract the language chart
        run: python scripts/round_contrib_svg.py
      - name: Remove unused 3D export variants
        run: |
          find profile-3d-contrib -maxdepth 1 -type f ! -name 'profile-night-view*.svg' -delete
      - name: Commit generated contribution images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update language distribution'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Animated Language Card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/animated-languages.yml"
      - ".github/scripts/render_languages.py"
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Generate language statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/render_languages.py
      - name: Save generated card and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages-animated.svg README.md
          if git diff --staged --quiet; then
            echo "No language statistics changes."
            exit 0
          fi
          git commit -m "chore: refresh animated language statistics [skip ci]"
          git push

name: Rotate README Profile Photo

on:
  schedule:
    - cron: "17 * * * *" # Hourly (UTC), offset from the weather updater.
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/rotate_profile_photo.py'
      - '.github/workflows/rotate-profile-photo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-readme-profile-photo
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install 'Pillow>=11,<13' 'pillow-heif>=1.0,<2'
      - name: Commit selected photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Recreate from the latest main to prevent generated-photo merge conflicts.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/rotate_profile_photo.py
            git add assets/profile-current.webp assets/.profile-last.txt README.md
            if git diff --cached --quiet; then
              echo "Profile photograph is already up to date"
              exit 0
            fi
            git commit -m 'chore: rotate README profile photo'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during update; retrying ($attempt/3)"
          done
          exit 1


name: Capture project screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-previews.yml
      - scripts/capture-previews.mjs

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture live apps
        run: node scripts/capture-previews.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add real screenshots of featured apps"
            git push
          fi

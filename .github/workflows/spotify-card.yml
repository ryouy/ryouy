name: Cache last healthy Spotify card

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/cache_spotify_card.py
      - .github/workflows/spotify-card.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-card-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep previous SVG on advertisements or upstream errors
        run: python scripts/cache_spotify_card.py
      - name: Commit only successful card changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/spotify-last-good.svg
          if git diff --cached --quiet; then
            echo 'No new healthy card to publish'
            exit 0
          fi
          git commit -m 'chore: cache last healthy Spotify card'
          git pull --rebase origin main
          git push origin HEAD:main

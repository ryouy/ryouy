name: Profile script checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-checks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo dependencies
        run: python -m pip install 'Pillow>=11,<13' 'pillow-heif>=1.0,<2'
      - name: Run offline profile regression checks
        run: python -m unittest discover -s scripts -p 'test_*.py'

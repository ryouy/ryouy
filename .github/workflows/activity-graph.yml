name: Activity Graph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/activity-graph.yml
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alexcerezo/activity-graph@v1
        with:
          username: ryouy
          token: ${{ github.token }}

name: Generate Experimental Snake Duet

on:
  push:
    branches: [main]
    paths:
      - scripts/generate_snake_duet.py
      - scripts/contribution_calendar.py
      - .github/workflows/snake-duet.yml
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-snake-duet
  cancel-in-progress: false

jobs:
  generate-duet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish only the experimental SVGs
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s scripts -p test_snake_duet.py
            python scripts/generate_snake_duet.py --repository "$REPOSITORY"
            git add assets/snake-duet.svg assets/snake-duet-dark.svg
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'chore: refresh experimental snake duet'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
